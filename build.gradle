plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0-rc.1'
    id "org.sonarqube" version "7.1.0.6387"
    id "co.uzzu.dotenv.gradle" version "4.0.0"
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org'
version = '1.0-SNAPSHOT'
description = 'ShopSimulator'

repositories {
    mavenCentral()
}

dependencies {

    //Spring Boot Web (API REST + embed server Tomcat)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    //Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.pitest:pitest-junit5-plugin:1.2.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

pitest {
    pitestVersion = '1.15.0'
    junit5PluginVersion = '1.2.1'
    targetClasses = ['org.app.*', 'org.logic.*']
    targetTests = ['org.logic.*', 'org.app.*']
    threads = 4
    outputFormats = ['HTML']
    timestampedReports = false
    testPlugin = 'junit5'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "ShopSimulator"
        property "sonar.projectName", "ShopSimulator"
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", ""

        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"

        property "sonar.inclusions", "src/main/java/**/*.java"
        property "sonar.exclusions", "**/Main.java, **/config/AppConfig.java, **/dto/Dto.java, **/static/**"
    }
}

