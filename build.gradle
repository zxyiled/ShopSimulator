plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0-rc.1'
    id "org.sonarqube" version "7.1.0.6387"
    id 'maven-publish'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'org'
version = '1.0-SNAPSHOT'
description = 'ShopSimulator'

repositories {
    mavenCentral()

    maven {
        url 'https://pkgs.dev.azure.com/sebasmejia/ShopSimulator/_packaging/ShopSimulator/maven/v1'
        name 'ShopSimulator'
        credentials(PasswordCredentials) {
            username = project.findProperty("ShopSimulatorUsername") ?: "AzureDevOps"
            password = System.getenv("AZURE_ARTIFACTS_ENV_ACCESS_TOKEN") ?: project.findProperty("ShopSimulatorPassword")
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url 'https://pkgs.dev.azure.com/sebasmejia/ShopSimulator/_packaging/ShopSimulator/maven/v1'
            name 'ShopSimulator'
            credentials(PasswordCredentials) {
                username = project.findProperty("ShopSimulatorUsername") ?: "AzureDevOps"
                password = System.getenv("AZURE_ARTIFACTS_ENV_ACCESS_TOKEN") ?: project.findProperty("ShopSimulatorPassword")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

dependencies {
    // Spring Boot Web (API REST + embedded Tomcat server)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Security (form login + HTTP Basic for the REST API)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Cucumber reporting and query utilities for test result analysis
    implementation "io.cucumber:query:14.7.0"
    implementation "io.cucumber:cucumber-parent:4.5.0"

    // Testing — JUnit platform BOM manages consistent versions
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spring Boot test utilities
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Cucumber — acceptance tests
    testImplementation 'io.cucumber:cucumber-java:7.34.2'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.2'
    testImplementation 'org.junit.platform:junit-platform-suite'

    // PiTest mutation testing
    testImplementation 'org.pitest:pitest-junit5-plugin:1.2.1'

    // Playwright — E2E tests (Firefox)
    testImplementation 'com.microsoft.playwright:playwright:1.49.0'
}

test {
    useJUnitPlatform()
    filter {
        excludeTestsMatching "e2e.*"
    }
}

pitest {
    pitestVersion = '1.15.0'
    junit5PluginVersion = '1.2.1'
    targetClasses = ['org.app.*', 'org.logic.*']
    targetTests = ['org.logic.*', 'org.app.*']
    threads = 4
    outputFormats = ['HTML']
    timestampedReports = false
}

jacocoTestReport {
    dependsOn(tasks.test)
    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "ShopSimulator"
        property "sonar.projectName", "ShopSimulator"

        def sonarHost = System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
        property "sonar.host.url", sonarHost

        def sonarToken = System.getenv("SONAR_TOKEN")
        if (sonarToken) {
            property "sonar.token", sonarToken
        }

        property "sonar.coverage.jacoco.xmlReportPaths",
                "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.inclusions", "src/main/java/**/*.java"
        property "sonar.exclusions", "**/Main.java, **/config/AppConfig.java"

        property "sonar.qualitygate.wait", "true"
    }
}

tasks.register("acceptanceTest", Test) {
    useJUnitPlatform()
    description = "Runs Cucumber acceptance tests."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching "runners.*"
    }
}

tasks.register("e2eTest", Test) {
    useJUnitPlatform()
    description = "Runs E2E tests with Playwright (Firefox). Requires the app running on :8080."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching "e2e.*"
    }
    outputs.upToDateWhen { false }
}

// ── Frontend (React + Vite, built with pnpm) ───────────────────────────────
node {
    version = '22.14.0'
    pnpmVersion = '10.33.4'
    download = true
    nodeProjectDir = file("${projectDir}/frontend")
}

tasks.register('pnpmBuild', com.github.gradle.node.pnpm.task.PnpmTask) {
    dependsOn 'pnpmInstall'
    args = ['run', 'build']
    inputs.dir('frontend/src')
    inputs.file('frontend/package.json')
    inputs.file('frontend/pnpm-lock.yaml')
    inputs.file('frontend/vite.config.ts')
    inputs.file('frontend/tsconfig.json')
    inputs.file('frontend/index.html')
    outputs.dir('frontend/dist')
}

tasks.named('processResources') {
    dependsOn 'pnpmBuild'
    from('frontend/dist') {
        into 'static'
    }
}

