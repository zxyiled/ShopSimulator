trigger:
  - main

pool:
  name: LocalPool   # Your local agent registered in Azure DevOps

variables:
  projectDir: '.'
  AZURE_ARTIFACTS_ENV_ACCESS_TOKEN: $(System.AccessToken)

steps:
  # Step 1: Checkout the code
  - checkout: self
    timeoutInMinutes: 10
    retryCountOnTaskFailure: 3

  # Step 2: Check Java version installed on the local agent
  - script: java -version
    displayName: "Check Java version (using local agent's)"
    workingDirectory: $(projectDir)

  # Step 3: Run build, unit tests and generate JaCoCo coverage report
  - task: Gradle@3
    displayName: "Build + unit tests + JaCoCo report"
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/**/*.xml'
      tasks: 'clean build test jacocoTestReport'

  # Step 4: Publish JaCoCo coverage results to Azure DevOps
  - task: PublishCodeCoverageResults@2
    displayName: "Publish JaCoCo coverage"
    inputs:
      codeCoverageTool: 'JaCoCo'
      summaryFileLocation: '**/build/reports/jacoco/test/jacocoTestReport.xml'
      reportDirectory: '**/build/reports/jacoco/test/html'
      failIfCoverageEmpty: true

  # Step 5: Run acceptance tests (Cucumber)
  - task: Gradle@3
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'acceptanceTest'
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'
      publishJUnitResults: true

  # Step 6: Run mutation tests (Pitest)
  - task: Gradle@3
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'pitest'

  # Step 7: SonarQube analysis
  - task: Gradle@3
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'sonar'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)
      SONAR_HOST_URL: $(SONAR_HOST_URL)

  # Step 8: Publish artifacts
  - task: Gradle@3
    displayName: "Publish to Azure Artifacts Feed"
    inputs:
      tasks: 'publish'
      workingDirectory: '$(projectDir)'
    env:
      AZURE_ARTIFACTS_ENV_ACCESS_TOKEN: $(System.AccessToken)
