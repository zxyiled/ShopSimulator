trigger:
  - main

pool:
  name: LocalPool  # Your local agent registered in Azure DevOps

variables:
  projectDir: '.'
  jmxFile: 'src/test/jmeter/tests/stress_test_pipeline.jmx'
  resultsFolder: '$(Build.ArtifactStagingDirectory)/jmeter-results'
  resultsFile: '$(Build.ArtifactStagingDirectory)/jmeter-results/results.jtl'
  htmlReport: '$(Build.ArtifactStagingDirectory)/jmeter-results/html'

steps:
  # Step 1: Checkout the code
  - checkout: self

  # Step 2: Check Java version installed on the local agent
  - script: java -version
    displayName: "Check Java version"
    workingDirectory: $(projectDir)

  # Step 3: Run unit tests and generate JaCoCo coverage report.
  - task: Gradle@3
    displayName: "Unit tests + JaCoCo report"
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
      tasks: 'clean test jacocoTestReport'

  # Step 4: Publish JaCoCo coverage results to Azure DevOps.
  - task: PublishCodeCoverageResults@2
    displayName: "Publish JaCoCo coverage"
    inputs:
      codeCoverageTool: 'JaCoCo'
      summaryFileLocation: '**/build/reports/jacoco/test/jacocoTestReport.xml'
      reportDirectory: '**/build/reports/jacoco/test/html'
      failIfCoverageEmpty: true

  # Step 5: Run acceptance tests (Cucumber).
  - task: Gradle@3
    displayName: "Acceptance tests (Cucumber)"
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'acceptanceTest'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'

  # Step 6: Run mutation tests (PiTest).
  - task: Gradle@3
    displayName: "Mutation tests (PiTest)"
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'pitest'

  # Step 7: SonarQube analysis.
  - task: Gradle@3
    displayName: "SonarQube analysis"
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'sonar'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)
      SONAR_HOST_URL: $(SONAR_HOST_URL)

  # Step 8: Run E2E tests (Playwright + Firefox) against the running app.
  - script: |
      # Start the app in the background. --no-daemon + setsid put the whole JVM
      # tree in one process group so it can be killed reliably at the end.
      setsid ./gradlew --no-daemon bootRun > bootRun.log 2>&1 &
      APP_PGID=$!
      echo "Started app (PGID $APP_PGID); waiting for http://localhost:8080/login"
      for i in $(seq 1 30); do
        if curl -sf -o /dev/null http://localhost:8080/login; then
          echo "App is up after $((i * 2))s"
          break
        fi
        sleep 2
      done
      ./gradlew e2eTest
      E2E_EXIT=$?
      echo "Stopping app (PGID $APP_PGID)"
      kill -- -$APP_PGID 2>/dev/null || true
      exit $E2E_EXIT
    displayName: "E2E tests (Playwright + Firefox)"
    workingDirectory: $(projectDir)

  # Step 9: Publish E2E JUnit results.
  - task: PublishTestResults@2
    displayName: "Publish E2E test results"
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/build/test-results/e2eTest/TEST-*.xml'
      testRunTitle: 'E2E (Playwright)'

  # Step 10: Publish E2E Cucumber HTML report as pipeline artifact
  - task: PublishBuildArtifacts@1
    displayName: "Publish E2E HTML report"
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/target/cucumber-reports-e2e.html'
      ArtifactName: 'e2e-report'
      publishLocation: 'Container'

  # Step 11: Create results folders for Stress Tests
  - script: |
      mkdir -p "$(htmlReport)"
    displayName: "Create JMeter results folders"

  # Step 12: Run JMeter stress tests
  - script: |
      jmeter -n -t "$(jmxFile)" -l "$(resultsFile)" -e -o "$(htmlReport)"
    displayName: "Run JMeter stress tests"

  # Step 13: Publish HTML report as pipeline artifact
  - task: PublishBuildArtifacts@1
    displayName: "Publish JMeter report"
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(htmlReport)'
      ArtifactName: 'jmeter-report'
      publishLocation: 'Container'
